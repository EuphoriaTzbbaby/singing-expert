name: Deploy Singing Expert to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to server (git pull + build + restart)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 47.101.42.177
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            set -e
            cd /var/www/html/pythonAndVue/singing-expert
            git fetch --all
            git reset --hard origin/main

            # 后端：装依赖（venv 在项目外层目录，不受 git reset 影响）
            source /var/www/html/pythonAndVue/venv/bin/activate
            pip install -r backend/requirements.txt

            # 前端：在服务器上构建
            cd frontend
            npm ci --production=false
            npm run build
            cd ..

            # 重启服务
            systemctl restart singing-expert
            docker exec nginx nginx -s reload

            # 健康检查（轮询重试，最多等 30 秒）
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8000/api/health; then
                break
              fi
              echo "等待后端启动... ($i/15)"
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/api/health || (echo "后端健康检查失败"; exit 1)
            curl -sf -o /dev/null http://127.0.0.1:8080/ || (echo "前端访问失败"; exit 1)
            echo "部署完成 ✅"

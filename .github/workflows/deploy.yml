name: Deploy Singing Expert to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Pack backend + frontend dist
        run: tar czf deploy.tar.gz backend/ frontend/dist/

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 47.101.42.177
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp/"
          timeout: 120s

      - name: Extract & restart services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 47.101.42.177
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /var/www/html/pythonAndVue/singing-expert
            tar xzf /tmp/deploy.tar.gz
            rm -f /tmp/deploy.tar.gz

            source /var/www/html/pythonAndVue/venv/bin/activate
            pip install -r backend/requirements.txt

            systemctl restart singing-expert
            docker exec nginx nginx -s reload

            # 健康检查（轮询重试，最多等 30 秒）
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8000/api/health; then
                break
              fi
              echo "等待后端启动... ($i/15)"
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/api/health || (echo "后端健康检查失败"; exit 1)
            curl -sf -o /dev/null http://127.0.0.1:8080/ || (echo "前端访问失败"; exit 1)
            echo "部署完成 ✅"
